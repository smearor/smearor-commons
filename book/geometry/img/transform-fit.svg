<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" font-family="'Source Code Pro',ui-monospace,monospace">
  <rect width="660" height="300" rx="14" fill="#0a0e16" stroke="#1c2433"/>

  <text x="170" y="52" fill="#8b98ad" font-size="11" letter-spacing="2" text-anchor="middle">BASELINE</text>
  <text x="480" y="52" fill="#8b98ad" font-size="11" letter-spacing="2" text-anchor="middle">CURRENT</text>

  <!-- baseline point set -->
  <polygon points="120,215 135,105 255,165" fill="none" stroke="#3a4560" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="120" cy="215" r="5" fill="#8b98ad"/>
  <circle cx="135" cy="105" r="5" fill="#8b98ad"/>
  <circle cx="255" cy="165" r="5" fill="#8b98ad"/>
  <circle cx="170" cy="162" r="4" fill="#f5b700"/>
  <text x="170" y="185" fill="#f5b700" font-size="10.5" text-anchor="middle">baseline_centroid</text>

  <!-- current point set: rot ~30deg, scale ~1.15, translated -->
  <polygon points="399.7,184 477.9,83.1 562.9,211.9" fill="none" stroke="#00a1e4" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="399.7" cy="184" r="5" fill="#00a1e4"/>
  <circle cx="477.9" cy="83.1" r="5" fill="#00a1e4"/>
  <circle cx="562.9" cy="211.9" r="5" fill="#00a1e4"/>
  <circle cx="480" cy="160" r="4" fill="#f5b700"/>
  <text x="480" y="240" fill="#f5b700" font-size="10.5" text-anchor="middle">current_centroid</text>

  <!-- rotation hint -->
  <path d="M520,160 A40 40 0 0 0 503.4,122.7" fill="none" stroke="#dc0073" stroke-width="2"/>
  <polygon points="503.4,122.7 495.9,129.4 504.9,132.4" fill="#dc0073"/>
  <text x="536" y="128" fill="#dc0073" font-size="11">rotation</text>

  <!-- translation arrow between centroids -->
  <line x1="196" y1="162" x2="452" y2="160" stroke="#f5b700" stroke-width="1.5" stroke-dasharray="5 4"/>
  <polygon points="452,160 443,156 443,164" fill="#f5b700"/>
  <text x="324" y="150" fill="#f5b700" font-size="11" text-anchor="middle">translation</text>

  <!-- scale note -->
  <text x="330" y="284" fill="#8b98ad" font-size="10.5" text-anchor="middle" letter-spacing="1">SimilarityTransform::fit(baseline, current) — rotation + uniform scale + translation</text>
</svg>
