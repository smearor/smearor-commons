<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" font-family="'Source Code Pro',ui-monospace,monospace">
  <rect width="660" height="300" rx="14" fill="#0a0e16" stroke="#1c2433"/>

  <!-- Deg0: 3x2 grid, cell size 40, origin (42,120) -->
  <text x="102" y="80" fill="#00a1e4" font-size="12" text-anchor="middle">Deg0</text>
  <g stroke="#1c2433" stroke-width="1.5" fill="#10151f">
    <rect x="42" y="120" width="120" height="80"/>
    <line x1="82" y1="120" x2="82" y2="200"/><line x1="122" y1="120" x2="122" y2="200"/>
    <line x1="42" y1="160" x2="162" y2="160"/>
  </g>
  <rect x="122" y="120" width="40" height="40" fill="#04e762" fill-opacity="0.15" stroke="#04e762" stroke-width="2"/>
  <g fill="#8b98ad" font-size="11" text-anchor="middle">
    <text x="62" y="145">0</text><text x="102" y="145">1</text>
    <text x="62" y="185">3</text><text x="102" y="185">4</text><text x="142" y="185">5</text>
  </g>
  <text x="142" y="145" fill="#04e762" font-size="11" text-anchor="middle">2</text>
  <text x="102" y="222" fill="#8b98ad" font-size="10" text-anchor="middle">index 2 stays (2,0)</text>

  <!-- Deg90: grid transposes to 2x3, cell (2,0) -> (1,2) -->
  <text x="267" y="80" fill="#f5b700" font-size="12" text-anchor="middle">Deg90</text>
  <g stroke="#1c2433" stroke-width="1.5" fill="#10151f">
    <rect x="227" y="100" width="80" height="120"/>
    <line x1="267" y1="100" x2="267" y2="220"/>
    <line x1="227" y1="140" x2="307" y2="140"/>
    <line x1="227" y1="180" x2="307" y2="180"/>
  </g>
  <rect x="267" y="180" width="40" height="40" fill="#04e762" fill-opacity="0.15" stroke="#04e762" stroke-width="2"/>
  <text x="267" y="245" fill="#8b98ad" font-size="10" text-anchor="middle">index 2 → cell (1,2)</text>

  <!-- Deg180: same 3x2 dims, cell (2,0) -> (0,1) -->
  <text x="432" y="80" fill="#dc0073" font-size="12" text-anchor="middle">Deg180</text>
  <g stroke="#1c2433" stroke-width="1.5" fill="#10151f">
    <rect x="372" y="120" width="120" height="80"/>
    <line x1="412" y1="120" x2="412" y2="200"/><line x1="452" y1="120" x2="452" y2="200"/>
    <line x1="372" y1="160" x2="492" y2="160"/>
  </g>
  <rect x="372" y="160" width="40" height="40" fill="#04e762" fill-opacity="0.15" stroke="#04e762" stroke-width="2"/>
  <text x="432" y="222" fill="#8b98ad" font-size="10" text-anchor="middle">index 2 → cell (0,1)</text>

  <!-- Deg270: transposed 2x3, cell (2,0) -> (0,0) -->
  <text x="597" y="80" fill="#89fc00" font-size="12" text-anchor="middle">Deg270</text>
  <g stroke="#1c2433" stroke-width="1.5" fill="#10151f">
    <rect x="557" y="100" width="80" height="120"/>
    <line x1="597" y1="100" x2="597" y2="220"/>
    <line x1="557" y1="140" x2="637" y2="140"/>
    <line x1="557" y1="180" x2="637" y2="180"/>
  </g>
  <rect x="557" y="100" width="40" height="40" fill="#04e762" fill-opacity="0.15" stroke="#04e762" stroke-width="2"/>
  <text x="597" y="245" fill="#8b98ad" font-size="10" text-anchor="middle">index 2 → cell (0,0)</text>

  <text x="330" y="282" fill="#8b98ad" font-size="10.5" text-anchor="middle" letter-spacing="1">Grid::rotated + Cell::rotated — odd turns swap cols and rows</text>
</svg>
