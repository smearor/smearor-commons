<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" font-family="'Source Code Pro',ui-monospace,monospace">
  <rect width="660" height="300" rx="14" fill="#0a0e16" stroke="#1c2433"/>

  <!-- mm space -->
  <rect x="40" y="55" width="250" height="190" rx="10" fill="#10151f" stroke="#1c2433"/>
  <text x="165" y="82" fill="#8b98ad" font-size="11" letter-spacing="2" text-anchor="middle">SURFACE · mm</text>
  <text x="165" y="102" fill="#e8ecf4" font-size="12" text-anchor="middle">Vec2&lt;Millimeters&gt;</text>
  <line x1="70" y1="220" x2="260" y2="220" stroke="#3a4560" stroke-width="1.5"/>
  <g stroke="#3a4560" stroke-width="1.5">
    <line x1="70" y1="220" x2="70" y2="212"/>
    <line x1="117.5" y1="220" x2="117.5" y2="212"/>
    <line x1="165" y1="220" x2="165" y2="212"/>
    <line x1="212.5" y1="220" x2="212.5" y2="212"/>
    <line x1="260" y1="220" x2="260" y2="212"/>
  </g>
  <circle cx="117.5" cy="160" r="4" fill="#f5b700"/>
  <text x="117.5" y="145" fill="#f5b700" font-size="11" text-anchor="middle">(10.0, 5.0) mm</text>

  <!-- px space -->
  <rect x="370" y="55" width="250" height="190" rx="10" fill="#10151f" stroke="#1c2433"/>
  <text x="495" y="82" fill="#8b98ad" font-size="11" letter-spacing="2" text-anchor="middle">SCREEN · px</text>
  <text x="495" y="102" fill="#e8ecf4" font-size="12" text-anchor="middle">Vec2&lt;Pixels&gt;</text>
  <g fill="#2a3550">
    <circle cx="400" cy="130" r="1.5"/><circle cx="430" cy="130" r="1.5"/><circle cx="460" cy="130" r="1.5"/><circle cx="490" cy="130" r="1.5"/><circle cx="520" cy="130" r="1.5"/><circle cx="550" cy="130" r="1.5"/><circle cx="580" cy="130" r="1.5"/>
    <circle cx="400" cy="160" r="1.5"/><circle cx="430" cy="160" r="1.5"/><circle cx="460" cy="160" r="1.5"/><circle cx="490" cy="160" r="1.5"/><circle cx="520" cy="160" r="1.5"/><circle cx="550" cy="160" r="1.5"/><circle cx="580" cy="160" r="1.5"/>
    <circle cx="400" cy="190" r="1.5"/><circle cx="430" cy="190" r="1.5"/><circle cx="460" cy="190" r="1.5"/><circle cx="490" cy="190" r="1.5"/><circle cx="520" cy="190" r="1.5"/><circle cx="550" cy="190" r="1.5"/><circle cx="580" cy="190" r="1.5"/>
  </g>
  <rect x="452" y="152" width="16" height="16" fill="none" stroke="#00a1e4" stroke-width="1.5"/>
  <text x="460" y="145" fill="#00a1e4" font-size="11" text-anchor="middle">(80, 40) px</text>

  <!-- bridge arrows -->
  <text x="330" y="115" fill="#e8ecf4" font-size="11" text-anchor="middle">PixelsPerMm</text>
  <text x="330" y="130" fill="#8b98ad" font-size="10" text-anchor="middle">::new(8.0)</text>
  <line x1="302" y1="145" x2="360" y2="145" stroke="#00a1e4" stroke-width="2"/>
  <polygon points="360,145 352,141 352,149" fill="#00a1e4"/>
  <text x="330" y="139" fill="#00a1e4" font-size="10" text-anchor="middle">scale</text>
  <line x1="360" y1="175" x2="302" y2="175" stroke="#dc0073" stroke-width="2"/>
  <polygon points="302,175 310,171 310,179" fill="#dc0073"/>
  <text x="330" y="188" fill="#dc0073" font-size="10" text-anchor="middle">unscale</text>
</svg>
