<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 320" font-family="'Source Code Pro',ui-monospace,monospace">
  <rect width="660" height="320" rx="14" fill="#0a0e16" stroke="#1c2433"/>

  <!-- frame: 4 cols x 3 rows, cell 80x70 -->
  <rect x="70" y="50" width="320" height="210" fill="#10151f" stroke="#1c2433" stroke-width="1.5"/>
  <g stroke="#1c2433" stroke-width="1.5">
    <line x1="150" y1="50" x2="150" y2="260"/>
    <line x1="230" y1="50" x2="230" y2="260"/>
    <line x1="310" y1="50" x2="310" y2="260"/>
    <line x1="70" y1="120" x2="390" y2="120"/>
    <line x1="70" y1="190" x2="390" y2="190"/>
  </g>

  <!-- row-major indices -->
  <g fill="#8b98ad" font-size="12" text-anchor="middle">
    <text x="110" y="91">0</text><text x="190" y="91">1</text><text x="270" y="91">2</text><text x="350" y="91">3</text>
    <text x="110" y="161">4</text><text x="190" y="161">5</text><text x="350" y="161">7</text>
    <text x="110" y="231">8</text><text x="190" y="231">9</text><text x="270" y="231">10</text><text x="350" y="231">11</text>
  </g>

  <!-- highlighted cell index 6 = (col 2, row 1) -->
  <rect x="230" y="120" width="80" height="70" fill="#04e762" fill-opacity="0.12" stroke="#04e762" stroke-width="2"/>
  <text x="270" y="163" fill="#04e762" font-size="14" text-anchor="middle">6</text>

  <!-- axis hints -->
  <text x="230" y="38" fill="#8b98ad" font-size="11" text-anchor="middle">Col →</text>
  <text x="56" y="160" fill="#8b98ad" font-size="11" text-anchor="middle" transform="rotate(-90 56 160)">Row ↓</text>

  <!-- annotations -->
  <text x="440" y="78" fill="#8b98ad" font-size="11" letter-spacing="2">GRID · 4 × 3</text>
  <g font-size="12">
    <text x="440" y="112" fill="#e8ecf4">Grid::new(4, 3)</text>
    <text x="440" y="138" fill="#8b98ad">capacity() → 12</text>
    <text x="440" y="164" fill="#04e762">cell(6) →</text>
    <text x="440" y="182" fill="#04e762">Cell { col: 2, row: 1 }</text>
    <text x="440" y="210" fill="#8b98ad">index(cell) → 6</text>
    <text x="440" y="236" fill="#8b98ad">rect(cell, frame) → Rect</text>
    <text x="440" y="262" fill="#8b98ad">cell_at(point) → hit test</text>
  </g>
  <line x1="312" y1="150" x2="428" y2="120" stroke="#04e762" stroke-width="1" stroke-dasharray="3 4"/>
</svg>
