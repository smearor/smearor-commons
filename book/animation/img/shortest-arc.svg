<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" font-family="'Source Code Pro',ui-monospace,monospace">
  <rect width="660" height="300" rx="14" fill="#0a0e16" stroke="#1c2433"/>

  <text x="330" y="36" fill="#8b98ad" font-size="11" letter-spacing="2" text-anchor="middle">ROTATIONRAD — wrap-aware shortest-arc interpolation</text>

  <!-- circle -->
  <circle cx="200" cy="170" r="100" fill="#10151f" stroke="#1c2433"/>
  <circle cx="200" cy="170" r="4" fill="#e8ecf4"/>

  <!-- 0deg marker (top) -->
  <line x1="200" y1="70" x2="200" y2="60" stroke="#3a4560" stroke-width="2"/>
  <text x="200" y="56" fill="#8b98ad" font-size="9" text-anchor="middle">0°</text>

  <!-- from: 350° (10° left of top) -->
  <line x1="200" y1="170" x2="183" y2="73" stroke="#00a1e4" stroke-width="2.5"/>
  <circle cx="183" cy="73" r="5" fill="#00a1e4"/>
  <text x="146" y="70" fill="#00a1e4" font-size="10" text-anchor="end">from 350°</text>

  <!-- to: 20° -->
  <line x1="200" y1="170" x2="234" y2="76" stroke="#dc0073" stroke-width="2.5"/>
  <circle cx="234" cy="76" r="5" fill="#dc0073"/>
  <text x="268" y="70" fill="#dc0073" font-size="10">to 20°</text>

  <!-- shortest arc: 350° -> 360/0 -> 20° = 30° -->
  <path d="M 183 73 A 100 100 0 0 1 234 76" fill="none" stroke="#04e762" stroke-width="3.5" stroke-dasharray="6 4"/>
  <text x="208" y="52" fill="#04e762" font-size="10" text-anchor="middle">+30°</text>

  <!-- long way: the rest of the circle, faint -->
  <path d="M 234 76 A 100 100 0 1 0 183 73" fill="none" stroke="#3a4560" stroke-width="1.5" stroke-dasharray="3 5"/>
  <text x="200" y="282" fill="#3a4560" font-size="10" text-anchor="middle">−330° — never taken</text>

  <!-- rules panel -->
  <rect x="360" y="80" width="270" height="180" rx="10" fill="#10151f" stroke="#1c2433"/>
  <text x="495" y="104" fill="#8b98ad" font-size="10.5" letter-spacing="1.5" text-anchor="middle">INTERPOLATE PER TYPE</text>
  <g font-size="10" fill="#8b98ad">
    <text x="376" y="130">f64 · f32 · Pixels · Mm</text>
    <text x="376" y="148">Degrees · Radians — lerp</text>
    <text x="376" y="166" fill="#04e762">RotationRad — shortest arc,</text>
    <text x="392" y="182" fill="#04e762">normalized into [0, 2π)</text>
    <text x="376" y="200">ScaleFactor — lerp</text>
    <text x="376" y="218">Vec2 — component-wise</text>
    <text x="376" y="236">(A, B) — pair-wise</text>
  </g>

  <text x="200" y="52" fill="#04e762" font-size="1" opacity="0">x</text>
</svg>
