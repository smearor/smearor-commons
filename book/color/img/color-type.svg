<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" font-family="'Source Code Pro',ui-monospace,monospace">
  <rect width="660" height="300" rx="14" fill="#0a0e16" stroke="#1c2433"/>

  <!-- channels -->
  <text x="150" y="50" fill="#8b98ad" font-size="11" letter-spacing="2" text-anchor="middle">COLOR&lt;T&gt; CHANNELS</text>
  <rect x="40" y="70" width="56" height="56" rx="8" fill="#ef3340" fill-opacity="0.25" stroke="#ef3340" stroke-width="1.5"/>
  <text x="68" y="104" fill="#e8ecf4" font-size="14" text-anchor="middle">r</text>
  <rect x="102" y="70" width="56" height="56" rx="8" fill="#00ab84" fill-opacity="0.25" stroke="#00ab84" stroke-width="1.5"/>
  <text x="130" y="104" fill="#e8ecf4" font-size="14" text-anchor="middle">g</text>
  <rect x="164" y="70" width="56" height="56" rx="8" fill="#00a1e4" fill-opacity="0.25" stroke="#00a1e4" stroke-width="1.5"/>
  <text x="192" y="104" fill="#e8ecf4" font-size="14" text-anchor="middle">b</text>
  <rect x="226" y="70" width="56" height="56" rx="8" fill="none" stroke="#8b98ad" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="254" y="104" fill="#8b98ad" font-size="14" text-anchor="middle">a</text>
  <text x="161" y="146" fill="#8b98ad" font-size="10.5" text-anchor="middle">T = u8 (0-255) · f64 / f32 (0.0-1.0)</text>

  <!-- composed result -->
  <rect x="310" y="70" width="56" height="56" rx="8" fill="#00a1e4"/>
  <text x="338" y="146" fill="#8b98ad" font-size="10.5" text-anchor="middle">#00a1e4</text>
  <line x1="288" y1="98" x2="304" y2="98" stroke="#8b98ad" stroke-width="1.5"/>
  <polygon points="304,98 297,94 297,102" fill="#8b98ad"/>

  <!-- accepted input forms -->
  <text x="470" y="50" fill="#8b98ad" font-size="11" letter-spacing="2" text-anchor="middle">FROMSTR / DISPLAY</text>
  <g font-size="12">
    <text x="400" y="80" fill="#e8ecf4">#rgb</text><text x="620" y="80" fill="#8b98ad" text-anchor="end">#0ae</text>
    <text x="400" y="104" fill="#e8ecf4">#rgba</text><text x="620" y="104" fill="#8b98ad" text-anchor="end">#0ae8</text>
    <text x="400" y="128" fill="#e8ecf4">#rrggbb</text><text x="620" y="128" fill="#8b98ad" text-anchor="end">#00a1e4</text>
    <text x="400" y="152" fill="#e8ecf4">#rrggbbaa</text><text x="620" y="152" fill="#8b98ad" text-anchor="end">#00a1e480</text>
  </g>
  <text x="470" y="176" fill="#3a4560" font-size="10" text-anchor="middle">shorthand digits double · alpha optional</text>

  <!-- conversions -->
  <text x="330" y="214" fill="#8b98ad" font-size="11" letter-spacing="2" text-anchor="middle">CHANNEL CONVERSIONS — From / Into</text>
  <g font-size="12">
    <text x="140" y="248" fill="#00a1e4" text-anchor="middle">Color&lt;u8&gt;</text>
    <text x="330" y="248" fill="#f5b700" text-anchor="middle">Color&lt;f64&gt;</text>
    <text x="520" y="248" fill="#dc0073" text-anchor="middle">Color&lt;f32&gt;</text>
  </g>
  <line x1="200" y1="244" x2="268" y2="244" stroke="#8b98ad" stroke-width="1.5"/>
  <polygon points="268,244 260,240 260,248" fill="#8b98ad"/><polygon points="200,244 208,240 208,248" fill="#8b98ad"/>
  <line x1="392" y1="244" x2="460" y2="244" stroke="#8b98ad" stroke-width="1.5"/>
  <polygon points="460,244 452,240 452,248" fill="#8b98ad"/><polygon points="392,244 400,240 400,248" fill="#8b98ad"/>
  <text x="330" y="280" fill="#3a4560" font-size="10" text-anchor="middle">u8 ↔ normalized float — alpha converts along</text>
</svg>
