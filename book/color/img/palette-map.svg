<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" font-family="'Source Code Pro',ui-monospace,monospace">
  <rect width="660" height="300" rx="14" fill="#0a0e16" stroke="#1c2433"/>

  <!-- definition -->
  <rect x="30" y="40" width="270" height="200" rx="10" fill="#10151f" stroke="#1c2433"/>
  <text x="165" y="66" fill="#8b98ad" font-size="10.5" letter-spacing="1.5" text-anchor="middle">palette_definition!</text>
  <g font-size="11.5">
    <text x="50" y="98" fill="#e8ecf4">enum BoardSlot {</text>
    <text x="70" y="122" fill="#00a1e4">Light =&gt; "light"</text>
    <text x="70" y="144" fill="#dc0073">Dark =&gt; "dark"</text>
    <text x="70" y="166" fill="#04e762">Accent =&gt; "accent"</text>
    <text x="70" y="188" fill="#f5b700">Danger =&gt; "danger"</text>
    <text x="50" y="210" fill="#e8ecf4">}</text>
  </g>

  <!-- map rows -->
  <g font-size="11">
    <text x="380" y="66" fill="#8b98ad" letter-spacing="1.5">PALETTE&lt;N, T&gt;</text>
    <line x1="300" y1="92" x2="356" y2="92" stroke="#00a1e4" stroke-width="1.5"/><polygon points="356,92 349,88 349,96" fill="#00a1e4"/>
    <rect x="360" y="78" width="42" height="28" rx="6" fill="#ede3d2"/><text x="412" y="96" fill="#8b98ad">"light"</text>
    <line x1="300" y1="114" x2="356" y2="114" stroke="#dc0073" stroke-width="1.5"/><polygon points="356,114 349,110 349,118" fill="#dc0073"/>
    <rect x="360" y="100" width="42" height="28" rx="6" fill="#2d2c2f"/><text x="412" y="118" fill="#8b98ad">"dark"</text>
    <line x1="300" y1="136" x2="356" y2="136" stroke="#04e762" stroke-width="1.5"/><polygon points="356,136 349,132 349,140" fill="#04e762"/>
    <rect x="360" y="122" width="42" height="28" rx="6" fill="#04e762"/><text x="412" y="140" fill="#8b98ad">"accent"</text>
    <line x1="300" y1="158" x2="356" y2="158" stroke="#f5b700" stroke-width="1.5"/><polygon points="356,158 349,154 349,162" fill="#f5b700"/>
    <rect x="360" y="144" width="42" height="28" rx="6" fill="#dc0073"/><text x="412" y="162" fill="#8b98ad">"danger"</text>
  </g>

  <!-- checks -->
  <rect x="470" y="78" width="160" height="94" rx="10" fill="#10151f" stroke="#04e762" stroke-opacity="0.5"/>
  <g font-size="10.5" fill="#04e762">
    <text x="482" y="102">missing() → []</text>
    <text x="482" y="124">is_complete() → true</text>
  </g>
  <text x="482" y="148" fill="#8b98ad" font-size="10">all slots filled</text>

  <!-- incomplete example -->
  <rect x="470" y="188" width="160" height="52" rx="10" fill="#10151f" stroke="#dc0073" stroke-opacity="0.5"/>
  <text x="482" y="210" fill="#dc0073" font-size="10.5">missing() → [Danger]</text>
  <text x="482" y="230" fill="#8b98ad" font-size="10">build_complete() errs</text>

  <text x="330" y="272" fill="#8b98ad" font-size="10.5" text-anchor="middle" letter-spacing="1">enum keys → type-checked slot lookups, completeness at runtime</text>
</svg>
