<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 320" font-family="'Source Code Pro',ui-monospace,monospace">
  <rect width="660" height="320" rx="14" fill="#0a0e16" stroke="#1c2433"/>

  <text x="330" y="36" fill="#8b98ad" font-size="11" letter-spacing="2" text-anchor="middle">ROTATIONSNAP — gesture drag → snap thresholds</text>

  <!-- dial -->
  <circle cx="180" cy="180" r="100" fill="#10151f" stroke="#1c2433"/>
  <circle cx="180" cy="180" r="4" fill="#e8ecf4"/>

  <!-- initial position (0°) -->
  <line x1="180" y1="180" x2="180" y2="82" stroke="#00a1e4" stroke-width="2.5"/>
  <circle cx="180" cy="82" r="5" fill="#00a1e4"/>
  <text x="180" y="70" fill="#00a1e4" font-size="10" text-anchor="middle">initial</text>

  <!-- direction threshold: 10° arc -->
  <path d="M 180 80 A 100 100 0 0 1 197 83" fill="none" stroke="#f5b700" stroke-width="4"/>
  <line x1="180" y1="180" x2="197" y2="83" stroke="#f5b700" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="216" y="92" fill="#f5b700" font-size="9">10°</text>

  <!-- snap threshold: 45° -->
  <path d="M 180 80 A 100 100 0 0 1 251 109" fill="none" stroke="#dc0073" stroke-width="4" stroke-dasharray="5 4" opacity="0.9"/>
  <line x1="180" y1="180" x2="251" y2="109" stroke="#dc0073" stroke-width="2"/>
  <text x="266" y="112" fill="#dc0073" font-size="9">45°</text>

  <!-- snapped target marker -->
  <circle cx="251" cy="109" r="5" fill="#dc0073"/>

  <!-- session flow right -->
  <g font-size="10.5">
    <rect x="340" y="80" width="290" height="46" rx="8" fill="#10151f" stroke="#f5b700" stroke-width="1.5"/>
    <text x="485" y="99" fill="#f5b700" font-size="10.5" text-anchor="middle">|total| &gt; direction (10°)</text>
    <text x="485" y="115" fill="#8b98ad" font-size="9.5" text-anchor="middle">→ SnapUpdate.feedback: 2° nudge, once</text>

    <rect x="340" y="140" width="290" height="46" rx="8" fill="#10151f" stroke="#dc0073" stroke-width="1.5"/>
    <text x="485" y="159" fill="#dc0073" font-size="10.5" text-anchor="middle">|total| ≥ snap (45°)</text>
    <text x="485" y="175" fill="#8b98ad" font-size="9.5" text-anchor="middle">→ SnapUpdate.target: QuarterTurn, once</text>

    <rect x="340" y="200" width="290" height="46" rx="8" fill="#10151f" stroke="#8b98ad" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="485" y="219" fill="#e8ecf4" font-size="10.5" text-anchor="middle">end() → Option&lt;RotationRad&gt;</text>
    <text x="485" y="235" fill="#8b98ad" font-size="9.5" text-anchor="middle">restore `initial` if never snapped</text>
  </g>

  <text x="330" y="306" fill="#8b98ad" font-size="10.5" text-anchor="middle">update() unwraps the 0°/360° jump — raw reports stay continuous</text>
</svg>
