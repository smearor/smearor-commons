<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 240" font-family="'Source Code Pro',ui-monospace,monospace">
  <rect width="660" height="240" rx="14" fill="#0a0e16" stroke="#1c2433"/>

  <text x="330" y="36" fill="#8b98ad" font-size="11" letter-spacing="2" text-anchor="middle">TIMEDANIMATION — one call per frame tick</text>

  <!-- pipeline -->
  <rect x="30" y="90" width="110" height="56" rx="10" fill="#10151f" stroke="#8b98ad" stroke-width="1.5"/>
  <text x="85" y="113" fill="#e8ecf4" font-size="11" text-anchor="middle">Instant</text>
  <text x="85" y="130" fill="#8b98ad" font-size="9" text-anchor="middle">start → elapsed</text>

  <rect x="160" y="90" width="120" height="56" rx="10" fill="#10151f" stroke="#00a1e4" stroke-width="1.5"/>
  <text x="220" y="108" fill="#00a1e4" font-size="10.5" text-anchor="middle">progress</text>
  <text x="220" y="124" fill="#8b98ad" font-size="9" text-anchor="middle">elapsed / duration</text>
  <text x="220" y="138" fill="#3a4560" font-size="8.5" text-anchor="middle">Fraction</text>

  <rect x="300" y="90" width="130" height="56" rx="10" fill="#10151f" stroke="#04e762" stroke-width="1.5"/>
  <text x="365" y="108" fill="#04e762" font-size="10.5" text-anchor="middle">EasingFunction</text>
  <text x="365" y="124" fill="#8b98ad" font-size="9" text-anchor="middle">.apply(t)</text>
  <text x="365" y="138" fill="#3a4560" font-size="8.5" text-anchor="middle">may exceed 1.0</text>

  <rect x="450" y="90" width="180" height="56" rx="10" fill="#10151f" stroke="#dc0073" stroke-width="1.5"/>
  <text x="540" y="108" fill="#dc0073" font-size="10.5" text-anchor="middle">Trajectory.value_at</text>
  <text x="540" y="124" fill="#8b98ad" font-size="9" text-anchor="middle">eased t → animated value</text>
  <text x="540" y="138" fill="#3a4560" font-size="8.5" text-anchor="middle">S::Value</text>

  <line x1="140" y1="118" x2="156" y2="118" stroke="#8b98ad" stroke-width="1.5"/>
  <polygon points="156,118 149,114 149,122" fill="#8b98ad"/>
  <line x1="280" y1="118" x2="296" y2="118" stroke="#8b98ad" stroke-width="1.5"/>
  <polygon points="296,118 289,114 289,122" fill="#8b98ad"/>
  <line x1="430" y1="118" x2="446" y2="118" stroke="#8b98ad" stroke-width="1.5"/>
  <polygon points="446,118 439,114 439,122" fill="#8b98ad"/>

  <!-- lifecycle notes -->
  <text x="330" y="180" fill="#8b98ad" font-size="10.5" text-anchor="middle">value() / value_at(now) → Option&lt;S::Value&gt;</text>
  <text x="330" y="200" fill="#3a4560" font-size="10" text-anchor="middle">None before start() — None after is_complete() — pure std, no clock inside</text>

  <text x="330" y="66" fill="#8b98ad" font-size="10.5" text-anchor="middle">trajectory + duration + easing, started once, sampled per frame</text>
</svg>
