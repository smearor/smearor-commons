<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" font-family="Source Code Pro,ui-monospace,monospace">
  <rect width="660" height="300" rx="14" fill="#0a0e16" stroke="#1c2433"/>

  <text x="330" y="36" fill="#8b98ad" font-size="11" letter-spacing="2" text-anchor="middle">EDGEOF — orientation vocabularies → layer-shell Edge</text>

  <!-- surface -->
  <rect x="120" y="80" width="180" height="150" rx="10" fill="#10151f" stroke="#3a4560"/>
  <text x="210" y="160" fill="#3a4560" font-size="10" text-anchor="middle">surface</text>

  <!-- edges -->
  <text x="210" y="252" fill="#00a1e4" font-size="11" text-anchor="middle">Edge::Bottom</text>
  <text x="210" y="70" fill="#f5b700" font-size="11" text-anchor="middle">Edge::Top</text>
  <text x="96" y="160" fill="#04e762" font-size="11" text-anchor="middle" transform="rotate(-90 96 160)">Edge::Left</text>
  <text x="324" y="160" fill="#dc0073" font-size="11" text-anchor="middle" transform="rotate(90 324 160)">Edge::Right</text>

  <!-- quarter turn arrows to edges -->
  <text x="210" y="120" fill="#e8ecf4" font-size="9.5" text-anchor="middle">Deg0 → Bottom</text>
  <text x="210" y="140" fill="#e8ecf4" font-size="9.5" text-anchor="middle">Deg90 → Left</text>
  <text x="210" y="160" fill="#e8ecf4" font-size="9.5" text-anchor="middle">Deg180 → Top</text>
  <text x="210" y="180" fill="#e8ecf4" font-size="9.5" text-anchor="middle">Deg270 → Right</text>
  <text x="210" y="205" fill="#8b98ad" font-size="9" text-anchor="middle">TableSide maps same-named</text>

  <!-- Rotation note -->
  <rect x="380" y="80" width="250" height="150" rx="10" fill="#10151f" stroke="#1c2433"/>
  <text x="505" y="104" fill="#8b98ad" font-size="10" letter-spacing="1.5" text-anchor="middle">ROTATION — Only When Snapped</text>
  <g font-size="10" fill="#8b98ad">
    <text x="396" y="132">Rotation::QuarterTurn(_)</text>
    <text x="412" y="150" fill="#04e762">→ Some(edge)</text>
    <text x="396" y="176">Rotation::Free(_)</text>
    <text x="412" y="194" fill="#dc0073">→ None — a free angle</text>
    <text x="412" y="208" fill="#dc0073">has no edge</text>
  </g>

  <text x="330" y="284" fill="#8b98ad" font-size="10.5" text-anchor="middle">feature "gtk4-layer-shell" — TableSide impl additionally needs "layout"</text>
</svg>
