<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" font-family="'Source Code Pro',ui-monospace,monospace">
  <rect width="660" height="300" rx="14" fill="#0a0e16" stroke="#1c2433"/>

  <text x="330" y="36" fill="#8b98ad" font-size="11" letter-spacing="2" text-anchor="middle">PRIMITIVE DRAW SPECS — what each one paints</text>

  <!-- fill_background -->
  <g>
    <rect x="40" y="56" width="96" height="72" rx="8" fill="#10151f" stroke="#1c2433"/>
    <rect x="50" y="66" width="76" height="52" rx="4" fill="#00a1e4" fill-opacity="0.25" stroke="#00a1e4" stroke-dasharray="3 3"/>
    <text x="88" y="146" fill="#e8ecf4" font-size="10" text-anchor="middle">fill_background</text>
  </g>
  <!-- fill_rect -->
  <g>
    <rect x="146" y="56" width="96" height="72" rx="8" fill="#10151f" stroke="#1c2433"/>
    <rect x="162" y="72" width="64" height="40" rx="2" fill="#f5b700" fill-opacity="0.5" stroke="#f5b700"/>
    <text x="194" y="146" fill="#e8ecf4" font-size="10" text-anchor="middle">fill_rect</text>
  </g>
  <!-- stroke_rect -->
  <g>
    <rect x="252" y="56" width="96" height="72" rx="8" fill="#10151f" stroke="#1c2433"/>
    <rect x="268" y="72" width="64" height="40" rx="2" fill="none" stroke="#04e762" stroke-width="3"/>
    <text x="300" y="146" fill="#e8ecf4" font-size="10" text-anchor="middle">stroke_rect</text>
  </g>
  <!-- fill_circle -->
  <g>
    <rect x="358" y="56" width="96" height="72" rx="8" fill="#10151f" stroke="#1c2433"/>
    <circle cx="406" cy="92" r="22" fill="#dc0073" fill-opacity="0.55" stroke="#dc0073"/>
    <text x="406" y="146" fill="#e8ecf4" font-size="10" text-anchor="middle">fill_circle</text>
  </g>
  <!-- fill_polygon -->
  <g>
    <rect x="464" y="56" width="96" height="72" rx="8" fill="#10151f" stroke="#1c2433"/>
    <polygon points="512,68 540,104 528,118 496,118 484,104" fill="#89fc00" fill-opacity="0.35" stroke="#89fc00"/>
    <text x="512" y="146" fill="#e8ecf4" font-size="10" text-anchor="middle">fill_polygon</text>
  </g>
  <!-- stroke_polyline -->
  <g>
    <rect x="40" y="164" width="96" height="72" rx="8" fill="#10151f" stroke="#1c2433"/>
    <polyline points="56,216 72,186 88,206 104,178 120,196" fill="none" stroke="#00a1e4" stroke-width="2.5"/>
    <text x="88" y="254" fill="#e8ecf4" font-size="10" text-anchor="middle">stroke_polyline</text>
  </g>
  <!-- fill_sector -->
  <g>
    <rect x="146" y="164" width="96" height="72" rx="8" fill="#10151f" stroke="#1c2433"/>
    <path d="M 194 200 m -24 0 a 24 24 0 0 1 20 -22 l 4 -6 a 30 30 0 0 0 -24 28 z" fill="none"/>
    <path d="M 194 200 L 176 180 A 24 24 0 0 1 218 188 L 208 192 A 12 12 0 0 0 185 192 Z" fill="#f5b700" fill-opacity="0.6" stroke="#f5b700"/>
    <circle cx="194" cy="200" r="24" fill="none" stroke="#3a4560" stroke-dasharray="3 3"/>
    <text x="194" y="254" fill="#e8ecf4" font-size="10" text-anchor="middle">fill_sector</text>
  </g>

  <!-- spec anatomy panel -->
  <rect x="252" y="164" width="368" height="72" rx="10" fill="#10151f" stroke="#1c2433"/>
  <text x="436" y="184" fill="#8b98ad" font-size="10" letter-spacing="1.5" text-anchor="middle">EVERY SPEC = geometry + Color&lt;f64&gt; + Alpha</text>
  <g font-size="10" fill="#8b98ad">
    <text x="268" y="206">FillRect → rect</text>
    <text x="268" y="222">StrokeRect → rect · line_width</text>
    <text x="470" y="206">FillSector → annulus + Arc</text>
    <text x="470" y="222">plain structs — no builder</text>
  </g>

  <text x="330" y="282" fill="#8b98ad" font-size="10.5" text-anchor="middle">all ops source-over blend — `alpha` multiplies the color's own alpha channel</text>
</svg>
