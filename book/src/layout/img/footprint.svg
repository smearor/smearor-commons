<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 280" font-family="'Source Code Pro',ui-monospace,monospace">
  <rect width="660" height="280" rx="14" fill="#0a0e16" stroke="#1c2433"/>

  <text x="330" y="36" fill="#8b98ad" font-size="11" letter-spacing="2" text-anchor="middle">ITEM → PLACEMENT — footprint stays honest about rotation</text>

  <!-- item -->
  <rect x="40" y="90" width="150" height="110" rx="10" fill="#10151f" stroke="#8b98ad" stroke-width="1.5"/>
  <text x="115" y="112" fill="#e8ecf4" font-size="11" text-anchor="middle">LayoutItem</text>
  <g font-size="9.5" fill="#8b98ad">
    <text x="56" y="136">size: Vec2</text>
    <text x="56" y="152">rotation: Rotation</text>
    <text x="56" y="168">seat: Option&lt;Seat&gt;</text>
    <text x="56" y="188" fill="#3a4560">what the caller wants</text>
  </g>

  <!-- arrow -->
  <line x1="196" y1="145" x2="248" y2="145" stroke="#8b98ad" stroke-width="1.5"/>
  <polygon points="248,145 241,141 241,149" fill="#8b98ad"/>
  <text x="222" y="136" fill="#8b98ad" font-size="9" text-anchor="middle">arrange()</text>

  <!-- placement -->
  <rect x="254" y="90" width="160" height="110" rx="10" fill="#10151f" stroke="#00a1e4" stroke-width="2"/>
  <text x="334" y="112" fill="#00a1e4" font-size="11" text-anchor="middle">Placement</text>
  <g font-size="9.5" fill="#8b98ad">
    <text x="270" y="136">center: Vec2</text>
    <text x="270" y="152">rotation: Rotation</text>
    <text x="270" y="168">size: Vec2 (footprint)</text>
    <text x="270" y="188" fill="#3a4560">what the strategy returns</text>
  </g>

  <!-- footprint_for visual -->
  <rect x="440" y="60" width="190" height="170" rx="10" fill="#10151f" stroke="#1c2433"/>
  <text x="535" y="82" fill="#8b98ad" font-size="9.5" text-anchor="middle">footprint_for()</text>
  <!-- unrotated -->
  <rect x="465" y="110" width="56" height="30" rx="3" fill="#f5b700" fill-opacity="0.3" stroke="#f5b700"/>
  <text x="493" y="129" fill="#f5b700" font-size="8.5" text-anchor="middle">w×h</text>
  <!-- quarter turn -->
  <rect x="545" y="96" width="30" height="56" rx="3" fill="#dc0073" fill-opacity="0.3" stroke="#dc0073"/>
  <text x="560" y="129" fill="#dc0073" font-size="8.5" text-anchor="middle">h×w</text>
  <text x="535" y="176" fill="#8b98ad" font-size="9" text-anchor="middle">quarter turns swap axes</text>
  <text x="535" y="190" fill="#8b98ad" font-size="9" text-anchor="middle">exactly — Free rotations</text>
  <text x="535" y="204" fill="#8b98ad" font-size="9" text-anchor="middle">approximate unrotated</text>

  <text x="330" y="256" fill="#8b98ad" font-size="10.5" text-anchor="middle">a seat-facing item's footprint is its bounding box at the seat's quarter turn</text>
</svg>
