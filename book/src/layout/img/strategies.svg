<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" font-family="'Source Code Pro',ui-monospace,monospace">
  <rect width="660" height="340" rx="14" fill="#0a0e16" stroke="#1c2433"/>

  <text x="330" y="36" fill="#8b98ad" font-size="11" letter-spacing="2" text-anchor="middle">THE TWO BUILT-IN STRATEGIES</text>

  <!-- FlowLayout -->
  <rect x="40" y="56" width="280" height="180" rx="10" fill="#10151f" stroke="#00a1e4" stroke-width="2"/>
  <text x="180" y="80" fill="#00a1e4" font-size="12" text-anchor="middle">FlowLayout</text>
  <text x="180" y="96" fill="#8b98ad" font-size="9" text-anchor="middle">anchor · gap · wrap — preserves rotation</text>

  <!-- flow grid: anchored top-left, wraps -->
  <rect x="60" y="110" width="46" height="30" rx="3" fill="#00a1e4" fill-opacity="0.3" stroke="#00a1e4"/>
  <rect x="112" y="110" width="46" height="30" rx="3" fill="#00a1e4" fill-opacity="0.3" stroke="#00a1e4"/>
  <rect x="164" y="110" width="46" height="30" rx="3" fill="#00a1e4" fill-opacity="0.3" stroke="#00a1e4"/>
  <rect x="216" y="110" width="46" height="30" rx="3" fill="none" stroke="#3a4560" stroke-dasharray="3 3"/>
  <!-- wrap to second row -->
  <rect x="60" y="146" width="46" height="30" rx="3" fill="#00a1e4" fill-opacity="0.3" stroke="#00a1e4"/>
  <rect x="112" y="146" width="46" height="30" rx="3" fill="#00a1e4" fill-opacity="0.3" stroke="#00a1e4"/>
  <!-- overflow marker -->
  <rect x="262" y="110" width="46" height="30" rx="3" fill="none" stroke="#dc0073" stroke-dasharray="3 3"/>
  <text x="285" y="129" fill="#dc0073" font-size="9" text-anchor="middle">fit?</text>
  <text x="180" y="196" fill="#8b98ad" font-size="9" text-anchor="middle">reads like text — wraps at the far edge;</text>
  <text x="180" y="210" fill="#8b98ad" font-size="9" text-anchor="middle">overflow → LayoutError::DoesNotFit</text>

  <!-- SeatLayout -->
  <rect x="340" y="56" width="280" height="186" rx="10" fill="#10151f" stroke="#dc0073" stroke-width="2"/>
  <text x="480" y="80" fill="#dc0073" font-size="12" text-anchor="middle">SeatLayout</text>
  <text x="480" y="96" fill="#8b98ad" font-size="9" text-anchor="middle">assignment · edge_margin · gap — rotates to seat</text>

  <!-- mini table -->
  <rect x="400" y="108" width="160" height="80" rx="6" fill="none" stroke="#3a4560"/>
  <!-- bottom seats -->
  <rect x="430" y="196" width="30" height="14" rx="2" fill="#dc0073" fill-opacity="0.3" stroke="#dc0073"/>
  <rect x="500" y="196" width="30" height="14" rx="2" fill="#dc0073" fill-opacity="0.3" stroke="#dc0073"/>
  <!-- top seat -->
  <rect x="465" y="94" width="30" height="14" rx="2" fill="#dc0073" fill-opacity="0.3" stroke="#dc0073"/>
  <!-- left seat -->
  <rect x="372" y="140" width="30" height="14" rx="2" fill="#dc0073" fill-opacity="0.3" stroke="#dc0073" transform="rotate(-90 387 147)"/>
  <text x="480" y="222" fill="#8b98ad" font-size="9" text-anchor="middle">pinned seats take their offset;</text>
  <text x="480" y="234" fill="#8b98ad" font-size="9" text-anchor="middle">rest round-robin over TableSide::ALL</text>

  <!-- anchor weights inset -->
  <rect x="40" y="256" width="280" height="64" rx="10" fill="#10151f" stroke="#1c2433"/>
  <text x="70" y="278" fill="#f5b700" font-size="9.5">AnchorWeights</text>
  <!-- 3x3 grid -->
  <g fill="#f5b700">
    <rect x="70" y="286" width="10" height="8" rx="1"/>
    <rect x="84" y="286" width="10" height="8" rx="1" fill-opacity="0.35"/>
    <rect x="98" y="286" width="10" height="8" rx="1" fill-opacity="0.35"/>
    <rect x="70" y="298" width="10" height="8" rx="1" fill-opacity="0.35"/>
    <rect x="84" y="298" width="10" height="8" rx="1" fill-opacity="0.35"/>
    <rect x="98" y="298" width="10" height="8" rx="1" fill-opacity="0.35"/>
    <rect x="70" y="310" width="10" height="8" rx="1" fill-opacity="0.35"/>
    <rect x="84" y="310" width="10" height="8" rx="1" fill-opacity="0.35"/>
    <rect x="98" y="310" width="10" height="8" rx="1" fill-opacity="0.35"/>
  </g>
  <text x="120" y="296" fill="#8b98ad" font-size="9">9 consts — horizontal picks the</text>
  <text x="120" y="309" fill="#8b98ad" font-size="9">item direction, vertical the line</text>

  <!-- index stability -->
  <rect x="340" y="256" width="280" height="64" rx="10" fill="#10151f" stroke="#1c2433"/>
  <text x="480" y="284" fill="#e8ecf4" font-size="10" text-anchor="middle">placements[i] answers items[i]</text>
  <text x="480" y="304" fill="#8b98ad" font-size="9.5" text-anchor="middle">index-stable — map back by position</text>
</svg>
