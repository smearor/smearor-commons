<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" font-family="'Source Code Pro',ui-monospace,monospace">
  <rect width="660" height="340" rx="14" fill="#0a0e16" stroke="#1c2433"/>

  <text x="330" y="36" fill="#8b98ad" font-size="11" letter-spacing="2" text-anchor="middle">TABLESIDES &amp; SEATS — the perimeter clock</text>

  <!-- table -->
  <rect x="130" y="80" width="260" height="180" rx="12" fill="#10151f" stroke="#1c2433"/>

  <!-- side labels -->
  <text x="260" y="176" fill="#3a4560" font-size="10" text-anchor="middle">table surface</text>

  <!-- Bottom side (Deg0): items read upright -->
  <rect x="180" y="266" width="34" height="22" rx="3" fill="none" stroke="#00a1e4" stroke-width="1.5"/>
  <text x="197" y="281" fill="#00a1e4" font-size="8" text-anchor="middle">A</text>
  <rect x="250" y="266" width="34" height="22" rx="3" fill="none" stroke="#00a1e4" stroke-width="1.5"/>
  <text x="267" y="281" fill="#00a1e4" font-size="8" text-anchor="middle">B</text>
  <text x="260" y="308" fill="#00a1e4" font-size="10" text-anchor="middle">Bottom — Deg0 (default)</text>

  <!-- Top side (Deg180): items flipped -->
  <g transform="rotate(180 267 82)">
    <rect x="250" y="71" width="34" height="22" rx="3" fill="none" stroke="#f5b700" stroke-width="1.5"/>
    <text x="267" y="86" fill="#f5b700" font-size="8" text-anchor="middle">C</text>
  </g>
  <text x="260" y="64" fill="#f5b700" font-size="10" text-anchor="middle">Top — Deg180</text>

  <!-- Left side (Deg90): items rotated 90 cw -->
  <g transform="rotate(90 112 170)">
    <rect x="95" y="159" width="34" height="22" rx="3" fill="none" stroke="#04e762" stroke-width="1.5"/>
    <text x="112" y="174" fill="#04e762" font-size="8" text-anchor="middle">D</text>
  </g>
  <text x="62" y="174" fill="#04e762" font-size="10" text-anchor="middle" transform="rotate(-90 62 174)">Left — Deg90</text>

  <!-- Right side (Deg270) -->
  <g transform="rotate(-90 408 170)">
    <rect x="391" y="159" width="34" height="22" rx="3" fill="none" stroke="#dc0073" stroke-width="1.5"/>
    <text x="408" y="174" fill="#dc0073" font-size="8" text-anchor="middle">E</text>
  </g>
  <text x="458" y="174" fill="#dc0073" font-size="10" text-anchor="middle" transform="rotate(90 458 174)">Right — Deg270</text>

  <!-- perimeter direction arrows -->
  <path d="M 370 288 L 150 288" stroke="#3a4560" stroke-width="1.2" stroke-dasharray="4 4" fill="none"/>
  <polygon points="150,288 157,285 157,291" fill="#3a4560"/>
  <text x="260" y="326" fill="#8b98ad" font-size="9.5" text-anchor="middle">perimeter_position() runs 0.0 → 4.0 clockwise from the bottom-right corner</text>

  <!-- seat anatomy right -->
  <rect x="470" y="80" width="160" height="180" rx="10" fill="#10151f" stroke="#1c2433"/>
  <text x="550" y="104" fill="#8b98ad" font-size="10" letter-spacing="1.5" text-anchor="middle">SEAT</text>
  <g font-size="9.5" fill="#8b98ad">
    <text x="486" y="128" fill="#e8ecf4">side: TableSide</text>
    <text x="486" y="148" fill="#e8ecf4">offset: Option&lt;</text>
    <text x="486" y="162" fill="#e8ecf4">  Fraction&gt;</text>
    <text x="486" y="188">None → strategy</text>
    <text x="486" y="202">distributes</text>
    <text x="486" y="222">Some(0.5) → pinned</text>
    <text x="486" y="236">Seat::center()</text>
  </g>

  <text x="550" y="288" fill="#8b98ad" font-size="9" text-anchor="middle">items rotate to face their side —</text>
  <text x="550" y="300" fill="#8b98ad" font-size="9" text-anchor="middle">upside down for the Top seat</text>
</svg>
