<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" font-family="'Source Code Pro',ui-monospace,monospace">
  <rect width="660" height="300" rx="14" fill="#0a0e16" stroke="#1c2433"/>

  <text x="330" y="36" fill="#8b98ad" font-size="11" letter-spacing="2" text-anchor="middle">CENTERED_GLYPH — visual center on the target point</text>

  <!-- before: baseline-aligned -->
  <rect x="40" y="70" width="280" height="160" rx="10" fill="#10151f" stroke="#1c2433"/>
  <text x="180" y="92" fill="#8b98ad" font-size="9.5" letter-spacing="1" text-anchor="middle">WITHOUT — baseline origin</text>
  <!-- target crosshair off-center from glyph -->
  <rect x="80" y="110" width="80" height="80" rx="4" fill="#dc0073" fill-opacity="0.15" stroke="#dc0073" stroke-dasharray="4 3"/>
  <text x="120" y="160" fill="#dc0073" font-size="28" text-anchor="middle">✦</text>
  <line x1="230" y1="150" x2="230" y2="150" stroke="#f5b700" stroke-width="0"/>
  <circle cx="230" cy="150" r="5" fill="none" stroke="#f5b700" stroke-width="2"/>
  <line x1="230" y1="140" x2="230" y2="160" stroke="#f5b700" stroke-width="1.5"/>
  <line x1="220" y1="150" x2="240" y2="150" stroke="#f5b700" stroke-width="1.5"/>
  <text x="230" y="175" fill="#f5b700" font-size="9" text-anchor="middle">target</text>
  <text x="180" y="215" fill="#8b98ad" font-size="9.5" text-anchor="middle">glyph sits wherever the baseline lands</text>

  <!-- after: bounds center = target -->
  <rect x="340" y="70" width="280" height="160" rx="10" fill="#10151f" stroke="#1c2433"/>
  <text x="480" y="92" fill="#8b98ad" font-size="9.5" letter-spacing="1" text-anchor="middle">WITH — px_bounds center = target</text>
  <rect x="420" y="110" width="80" height="80" rx="4" fill="#04e762" fill-opacity="0.15" stroke="#04e762"/>
  <text x="460" y="160" fill="#04e762" font-size="28" text-anchor="middle">✦</text>
  <circle cx="460" cy="150" r="5" fill="none" stroke="#f5b700" stroke-width="2"/>
  <line x1="460" y1="140" x2="460" y2="160" stroke="#f5b700" stroke-width="1.5"/>
  <line x1="450" y1="150" x2="470" y2="150" stroke="#f5b700" stroke-width="1.5"/>
  <text x="480" y="215" fill="#8b98ad" font-size="9.5" text-anchor="middle">target − bounds.center() → exact visual center</text>

  <text x="330" y="266" fill="#8b98ad" font-size="10.5" text-anchor="middle">asymmetric glyphs (icons, accents) center on what you *see*, not on the em box</text>
</svg>
