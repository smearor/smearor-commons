<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" font-family="'Source Code Pro',ui-monospace,monospace">
  <rect width="660" height="300" rx="14" fill="#0a0e16" stroke="#1c2433"/>

  <!-- packed -->
  <text x="40" y="44" fill="#00a1e4" font-size="12">packed — stride == width × bpp</text>
  <g>
    <rect x="40" y="60" width="96" height="22" fill="#00a1e4" fill-opacity="0.18" stroke="#00a1e4"/>
    <rect x="136" y="60" width="96" height="22" fill="#00a1e4" fill-opacity="0.18" stroke="#00a1e4"/>
    <rect x="232" y="60" width="96" height="22" fill="#00a1e4" fill-opacity="0.18" stroke="#00a1e4"/>
    <rect x="40" y="82" width="96" height="22" fill="#f5b700" fill-opacity="0.18" stroke="#f5b700"/>
    <rect x="136" y="82" width="96" height="22" fill="#f5b700" fill-opacity="0.18" stroke="#f5b700"/>
    <rect x="232" y="82" width="96" height="22" fill="#f5b700" fill-opacity="0.18" stroke="#f5b700"/>
  </g>
  <text x="40" y="124" fill="#8b98ad" font-size="10">Vec&lt;u8&gt; — PixelBuffer, BufferView::from_packed</text>
  <text x="40" y="142" fill="#3a4560" font-size="10">row (y) starts at y × width × bpp</text>

  <!-- strided -->
  <text x="40" y="190" fill="#dc0073" font-size="12">strided — stride ≥ width × bpp</text>
  <g>
    <rect x="40" y="206" width="96" height="22" fill="#00a1e4" fill-opacity="0.18" stroke="#00a1e4"/>
    <rect x="136" y="206" width="96" height="22" fill="#00a1e4" fill-opacity="0.18" stroke="#00a1e4"/>
    <rect x="232" y="206" width="96" height="22" fill="#00a1e4" fill-opacity="0.18" stroke="#00a1e4"/>
    <rect x="328" y="206" width="30" height="22" fill="#1c2433"/>
    <rect x="40" y="228" width="96" height="22" fill="#f5b700" fill-opacity="0.18" stroke="#f5b700"/>
    <rect x="136" y="228" width="96" height="22" fill="#f5b700" fill-opacity="0.18" stroke="#f5b700"/>
    <rect x="232" y="228" width="96" height="22" fill="#f5b700" fill-opacity="0.18" stroke="#f5b700"/>
    <rect x="328" y="228" width="30" height="22" fill="#1c2433"/>
  </g>
  <text x="40" y="270" fill="#8b98ad" font-size="10">foreign memory — Wayland SHM, framework surfaces</text>
  <text x="40" y="288" fill="#3a4560" font-size="10">padding bytes belong to the producer, not the pixels</text>

  <!-- offset math -->
  <rect x="430" y="52" width="200" height="196" rx="10" fill="#10151f" stroke="#1c2433"/>
  <text x="530" y="78" fill="#8b98ad" font-size="10.5" letter-spacing="1.5" text-anchor="middle">BUFFERMETADATA</text>
  <g font-size="11" fill="#e8ecf4">
    <text x="446" y="106">width: Pixels&lt;u32&gt;</text>
    <text x="446" y="130">height: Pixels&lt;u32&gt;</text>
    <text x="446" y="154">stride: Stride</text>
  </g>
  <g font-size="10" fill="#8b98ad">
    <text x="446" y="186">row_offset(y) → usize</text>
    <text x="446" y="206">pixel_offset(x, y) → usize</text>
    <text x="446" y="226">required_len(bpp)</text>
  </g>
</svg>
