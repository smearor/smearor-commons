<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 280" font-family="'Source Code Pro',ui-monospace,monospace">
  <rect width="660" height="280" rx="14" fill="#0a0e16" stroke="#1c2433"/>

  <text x="330" y="40" fill="#8b98ad" font-size="11" letter-spacing="2" text-anchor="middle">GTK4 BRIDGE — gdk types ↔ buffer types</text>

  <!-- left: gdk world -->
  <rect x="50" y="70" width="200" height="60" rx="10" fill="#10151f" stroke="#8b98ad" stroke-width="1.5"/>
  <text x="150" y="95" fill="#e8ecf4" font-size="12" text-anchor="middle">gdk::MemoryTexture</text>
  <text x="150" y="113" fill="#8b98ad" font-size="9.5" text-anchor="middle">download() → GBytes</text>

  <rect x="50" y="160" width="200" height="60" rx="10" fill="#10151f" stroke="#8b98ad" stroke-width="1.5"/>
  <text x="150" y="185" fill="#e8ecf4" font-size="12" text-anchor="middle">MemoryFormat</text>
  <text x="150" y="203" fill="#8b98ad" font-size="9.5" text-anchor="middle">R8G8B8A8 · B8G8R8A8 · …</text>

  <!-- right: commons world -->
  <rect x="410" y="70" width="200" height="60" rx="10" fill="#10151f" stroke="#00a1e4" stroke-width="2"/>
  <text x="510" y="95" fill="#00a1e4" font-size="12" text-anchor="middle">PixelBuffer&lt;Rgba&gt;</text>
  <text x="510" y="113" fill="#8b98ad" font-size="9.5" text-anchor="middle">from_texture / decode_image</text>

  <rect x="410" y="160" width="200" height="60" rx="10" fill="#10151f" stroke="#f5b700" stroke-width="1.5"/>
  <text x="510" y="185" fill="#f5b700" font-size="12" text-anchor="middle">PixelFormatId</text>
  <text x="510" y="203" fill="#8b98ad" font-size="9.5" text-anchor="middle">From ↔ TryFrom</text>

  <!-- arrows -->
  <line x1="250" y1="100" x2="402" y2="100" stroke="#00a1e4" stroke-width="1.5"/>
  <polygon points="402,100 394,96 394,104" fill="#00a1e4"/>
  <line x1="402" y1="115" x2="250" y2="115" stroke="#8b98ad" stroke-width="1.5"/>
  <polygon points="250,115 258,111 258,119" fill="#8b98ad"/>
  <text x="326" y="90" fill="#8b98ad" font-size="10" text-anchor="middle">texture bytes</text>

  <line x1="250" y1="184" x2="402" y2="184" stroke="#f5b700" stroke-width="1.5"/>
  <polygon points="402,184 394,180 394,188" fill="#f5b700"/>
  <polygon points="250,184 258,180 258,188" fill="#f5b700"/>
  <text x="326" y="176" fill="#8b98ad" font-size="10" text-anchor="middle">format ↔ id</text>

  <text x="330" y="256" fill="#8b98ad" font-size="10.5" text-anchor="middle">TextureError covers download failures and image decode</text>
</svg>
