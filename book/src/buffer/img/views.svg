<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" font-family="'Source Code Pro',ui-monospace,monospace">
  <rect width="660" height="300" rx="14" fill="#0a0e16" stroke="#1c2433"/>

  <!-- owners -->
  <rect x="40" y="60" width="180" height="70" rx="10" fill="#10151f" stroke="#00a1e4" stroke-width="2"/>
  <text x="130" y="88" fill="#00a1e4" font-size="13" text-anchor="middle">PixelBuffer&lt;F&gt;</text>
  <text x="130" y="108" fill="#8b98ad" font-size="10" text-anchor="middle">owns Vec&lt;u8&gt;</text>

  <rect x="30" y="190" width="210" height="70" rx="10" fill="#10151f" stroke="#8b98ad" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="135" y="218" fill="#e8ecf4" font-size="13" text-anchor="middle">foreign memory</text>
  <text x="135" y="238" fill="#8b98ad" font-size="10" text-anchor="middle">Wayland SHM · framework surfaces</text>

  <!-- views -->
  <rect x="330" y="40" width="290" height="56" rx="10" fill="#10151f" stroke="#04e762" stroke-width="1.5"/>
  <text x="475" y="64" fill="#04e762" font-size="12.5" text-anchor="middle">BufferView&lt;'a, F&gt;</text>
  <text x="475" y="82" fill="#8b98ad" font-size="10" text-anchor="middle">read-only borrow — from_raw / from_packed</text>

  <rect x="330" y="110" width="290" height="56" rx="10" fill="#10151f" stroke="#dc0073" stroke-width="1.5"/>
  <text x="475" y="134" fill="#dc0073" font-size="12.5" text-anchor="middle">BufferViewMut&lt;'a, F&gt;</text>
  <text x="475" y="152" fill="#8b98ad" font-size="10" text-anchor="middle">mutable borrow — row_mut, fill</text>

  <!-- consumer -->
  <rect x="330" y="204" width="290" height="56" rx="10" fill="#10151f" stroke="#f5b700" stroke-width="1.5"/>
  <text x="475" y="228" fill="#f5b700" font-size="12.5" text-anchor="middle">smearor-commons-drawing</text>
  <text x="475" y="246" fill="#8b98ad" font-size="10" text-anchor="middle">DrawTarget on BufferViewMut / PixelBuffer</text>

  <!-- arrows -->
  <line x1="220" y1="80" x2="322" y2="60" stroke="#04e762" stroke-width="1.5"/>
  <polygon points="322,60 314,57 315,65" fill="#04e762"/>
  <text x="268" y="56" fill="#04e762" font-size="10" text-anchor="middle">view()</text>

  <line x1="220" y1="108" x2="322" y2="132" stroke="#dc0073" stroke-width="1.5"/>
  <polygon points="322,132 314,130 315,138" fill="#dc0073"/>
  <text x="268" y="122" fill="#dc0073" font-size="10" text-anchor="middle">view_mut()</text>

  <line x1="240" y1="200" x2="322" y2="100" stroke="#8b98ad" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="240" y1="226" x2="322" y2="148" stroke="#8b98ad" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="268" y="176" fill="#8b98ad" font-size="10" text-anchor="middle">borrow</text>

  <line x1="475" y1="96" x2="475" y2="196" stroke="#f5b700" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="475" y1="166" x2="475" y2="196" stroke="#f5b700" stroke-width="1.5"/>
  <polygon points="475,196 471,189 479,189" fill="#f5b700"/>
