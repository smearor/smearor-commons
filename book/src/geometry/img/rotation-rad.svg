<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" font-family="'Source Code Pro',ui-monospace,monospace">
  <rect width="660" height="300" rx="14" fill="#0a0e16" stroke="#1c2433"/>

  <!-- dial -->
  <circle cx="190" cy="160" r="105" fill="none" stroke="#46536b" stroke-width="1.5" stroke-dasharray="4 5" opacity="0.8"/>
  <circle cx="295" cy="160" r="3" fill="#8b98ad"/>
  <circle cx="190" cy="55" r="3" fill="#8b98ad"/>
  <circle cx="85" cy="160" r="3" fill="#8b98ad"/>
  <circle cx="190" cy="265" r="3" fill="#8b98ad"/>

  <!-- zero ray + rotated ray -->
  <line x1="190" y1="160" x2="295" y2="160" stroke="#8b98ad" stroke-width="1.5"/>
  <line x1="190" y1="160" x2="242.5" y2="69.1" stroke="#00a1e4" stroke-width="2.5"/>
  <circle cx="242.5" cy="69.1" r="3.5" fill="#00a1e4"/>

  <!-- angle arc -->
  <path d="M224,160 A34 34 0 0 0 207,130.6" fill="none" stroke="#f5b700" stroke-width="2"/>
  <polygon points="207,130.6 200.6,137.8 209.5,139.9" fill="#f5b700"/>
  <text x="228" y="146" fill="#f5b700" font-size="12">60°</text>

  <!-- consts table -->
  <text x="380" y="60" fill="#8b98ad" font-size="11" letter-spacing="2">ROTATIONRAD CONSTS</text>
  <g font-size="12">
    <text x="380" y="90" fill="#00a1e4">ZERO</text><text x="610" y="90" fill="#8b98ad" text-anchor="end">0 rad</text>
    <text x="380" y="114" fill="#e8ecf4">TWELFTH_TURN</text><text x="610" y="114" fill="#8b98ad" text-anchor="end">30°</text>
    <text x="380" y="138" fill="#e8ecf4">EIGHTH_TURN</text><text x="610" y="138" fill="#8b98ad" text-anchor="end">45°</text>
    <text x="380" y="162" fill="#e8ecf4">SIXTH_TURN</text><text x="610" y="162" fill="#8b98ad" text-anchor="end">60°</text>
    <text x="380" y="186" fill="#00a1e4">QUARTER_TURN</text><text x="610" y="186" fill="#8b98ad" text-anchor="end">90°</text>
    <text x="380" y="210" fill="#e8ecf4">THIRD_TURN</text><text x="610" y="210" fill="#8b98ad" text-anchor="end">120°</text>
    <text x="380" y="234" fill="#dc0073">HALF_TURN</text><text x="610" y="234" fill="#8b98ad" text-anchor="end">180°</text>
    <text x="380" y="258" fill="#04e762">FULL_TURN</text><text x="610" y="258" fill="#8b98ad" text-anchor="end">2π rad</text>
  </g>
</svg>
