<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 280" font-family="'Source Code Pro',ui-monospace,monospace">
  <rect width="660" height="280" rx="14" fill="#0a0e16" stroke="#1c2433"/>

  <text x="330" y="36" fill="#8b98ad" font-size="11" letter-spacing="2" text-anchor="middle">TRUNCATE_TEXT_TO_WIDTH — advance accumulation</text>

  <!-- text run with per-char ticks -->
  <g font-size="13" fill="#e8ecf4">
    <text x="80" y="100">L a u n c h e r</text>
  </g>
  <!-- advance ticks per char -->
  <g stroke="#00a1e4" stroke-width="1">
    <line x1="80" y1="112" x2="80" y2="122"/>
    <line x1="93" y1="112" x2="93" y2="122"/>
    <line x1="104" y1="112" x2="104" y2="122"/>
    <line x1="120" y1="112" x2="120" y2="122"/>
    <line x1="134" y1="112" x2="134" y2="122"/>
    <line x1="148" y1="112" x2="148" y2="122"/>
    <line x1="160" y1="112" x2="160" y2="122"/>
    <line x1="177" y1="112" x2="177" y2="122"/>
  </g>
  <text x="128" y="140" fill="#00a1e4" font-size="9" text-anchor="middle">current_width += h_advance(glyph_id)</text>

  <!-- max_width boundary -->
  <line x1="200" y1="80" x2="200" y2="180" stroke="#dc0073" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="200" y="196" fill="#dc0073" font-size="10" text-anchor="middle">max_width</text>

  <!-- rejected char -->
  <text x="210" y="100" fill="#3a4560" font-size="13">…</text>
  <text x="280" y="100" fill="#8b98ad" font-size="10">first char past the limit → stop</text>

  <!-- result -->
  <rect x="80" y="210" width="500" height="48" rx="8" fill="#10151f" stroke="#1c2433"/>
  <text x="96" y="232" fill="#8b98ad" font-size="10">returns the fitted prefix —</text>
  <text x="96" y="248" fill="#e8ecf4" font-size="10">the caller decides whether to append "…" itself</text>
  <text x="470" y="240" fill="#04e762" font-size="10" text-anchor="middle">O(n) — one pass</text>

  <text x="330" y="60" fill="#8b98ad" font-size="10.5" text-anchor="middle">each character's horizontal advance is measured at the scaled font until the limit</text>
</svg>
