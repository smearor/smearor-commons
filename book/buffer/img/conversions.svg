<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" font-family="'Source Code Pro',ui-monospace,monospace">
  <rect width="660" height="300" rx="14" fill="#0a0e16" stroke="#1c2433"/>

  <text x="330" y="40" fill="#8b98ad" font-size="11" letter-spacing="2" text-anchor="middle">PIXELBUFFER CONVERSIONS — in-place channel math</text>

  <!-- nodes -->
  <rect x="70" y="80" width="150" height="52" rx="10" fill="#10151f" stroke="#00a1e4" stroke-width="2"/>
  <text x="145" y="104" fill="#00a1e4" font-size="13" text-anchor="middle">Rgba</text>
  <text x="145" y="122" fill="#8b98ad" font-size="9.5" text-anchor="middle">r g b a</text>

  <rect x="440" y="80" width="150" height="52" rx="10" fill="#10151f" stroke="#f5b700" stroke-width="2"/>
  <text x="515" y="104" fill="#f5b700" font-size="13" text-anchor="middle">Bgra</text>
  <text x="515" y="122" fill="#8b98ad" font-size="9.5" text-anchor="middle">b g r a</text>

  <rect x="70" y="190" width="150" height="52" rx="10" fill="#10151f" stroke="#dc0073" stroke-width="1.5"/>
  <text x="145" y="212" fill="#dc0073" font-size="12.5" text-anchor="middle">RgbaPremult.</text>
  <text x="145" y="230" fill="#8b98ad" font-size="9.5" text-anchor="middle">r·a g·a b·a a</text>

  <rect x="440" y="190" width="150" height="52" rx="10" fill="#10151f" stroke="#dc0073" stroke-width="1.5"/>
  <text x="515" y="212" fill="#dc0073" font-size="12.5" text-anchor="middle">BgraPremult.</text>
  <text x="515" y="230" fill="#8b98ad" font-size="9.5" text-anchor="middle">b·a g·a r·a a</text>

  <!-- top: channel swap -->
  <line x1="220" y1="98" x2="432" y2="98" stroke="#8b98ad" stroke-width="1.5"/>
  <polygon points="432,98 424,94 424,102" fill="#8b98ad"/><polygon points="220,98 228,94 228,102" fill="#8b98ad"/>
  <text x="326" y="90" fill="#8b98ad" font-size="10" text-anchor="middle">into_bgra() / into_rgba()</text>

  <!-- left: premultiply both ways -->
  <line x1="138" y1="132" x2="138" y2="182" stroke="#04e762" stroke-width="1.5"/>
  <polygon points="138,182 134,175 142,175" fill="#04e762"/>
  <line x1="152" y1="182" x2="152" y2="132" stroke="#8b98ad" stroke-width="1.5"/>
  <polygon points="152,132 148,139 156,139" fill="#8b98ad"/>
  <text x="130" y="162" fill="#04e762" font-size="9.5" text-anchor="end">premultiply</text>
  <text x="164" y="162" fill="#8b98ad" font-size="9.5">unpremultiply</text>

  <!-- right: premultiply both ways -->
  <line x1="508" y1="132" x2="508" y2="182" stroke="#04e762" stroke-width="1.5"/>
  <polygon points="508,182 504,175 512,175" fill="#04e762"/>
  <line x1="522" y1="182" x2="522" y2="132" stroke="#8b98ad" stroke-width="1.5"/>
  <polygon points="522,132 518,139 526,139" fill="#8b98ad"/>

  <!-- bottom: channel swap on premultiplied side -->
  <line x1="220" y1="216" x2="432" y2="216" stroke="#8b98ad" stroke-width="1.5"/>
  <polygon points="432,216 424,212 424,220" fill="#8b98ad"/><polygon points="220,216 228,212 228,220" fill="#8b98ad"/>
  <text x="326" y="208" fill="#8b98ad" font-size="10" text-anchor="middle">into_bgra() / into_rgba()</text>

  <text x="330" y="272" fill="#8b98ad" font-size="10.5" text-anchor="middle">diagonal conversions compose swap + premultiply — all ops rewrite pixels in place</text>
</svg>
