<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" font-family="'Source Code Pro',ui-monospace,monospace">
  <rect width="700" height="300" rx="14" fill="#0a0e16" stroke="#1c2433"/>

  <text x="350" y="36" fill="#8b98ad" font-size="11" letter-spacing="2" text-anchor="middle">THE HOSKINS RECIPE - HASH12(p)</text>

  <!-- input -->
  <rect x="30" y="120" width="90" height="60" rx="10" fill="#10151f" stroke="#00a1e4" stroke-width="2"/>
  <text x="75" y="146" fill="#00a1e4" font-size="12" text-anchor="middle">input</text>
  <text x="75" y="166" fill="#8b98ad" font-size="11" text-anchor="middle">p : vec2</text>

  <!-- step 1 -->
  <rect x="155" y="80" width="150" height="140" rx="10" fill="#10151f" stroke="#1c2433" stroke-width="2"/>
  <text x="230" y="104" fill="#00a1e4" font-size="12" text-anchor="middle">broadcast + scale</text>
  <text x="230" y="130" fill="#8b98ad" font-size="10" text-anchor="middle">p3 = p.xyx</text>
  <text x="230" y="150" fill="#8b98ad" font-size="10" text-anchor="middle">p3 *= 0.1031</text>
  <text x="230" y="170" fill="#8b98ad" font-size="10" text-anchor="middle">p3 = fract(p3)</text>
  <text x="230" y="200" fill="#5a6577" font-size="9" text-anchor="middle">Vec2::xyx, component_mul</text>

  <!-- step 2 -->
  <rect x="340" y="80" width="150" height="140" rx="10" fill="#10151f" stroke="#1c2433" stroke-width="2"/>
  <text x="415" y="104" fill="#00a1e4" font-size="12" text-anchor="middle">decorrelate</text>
  <text x="415" y="130" fill="#8b98ad" font-size="10" text-anchor="middle">d = dot(p3,</text>
  <text x="415" y="148" fill="#8b98ad" font-size="10" text-anchor="middle">  p3.yzx + 33.33)</text>
  <text x="415" y="170" fill="#8b98ad" font-size="10" text-anchor="middle">p3 += d</text>
  <text x="415" y="200" fill="#5a6577" font-size="9" text-anchor="middle">Vec3::dot, Vec3::yzx, map</text>

  <!-- step 3 -->
  <rect x="525" y="80" width="150" height="140" rx="10" fill="#10151f" stroke="#1c2433" stroke-width="2"/>
  <text x="600" y="104" fill="#00a1e4" font-size="12" text-anchor="middle">fold + fract</text>
  <text x="600" y="130" fill="#8b98ad" font-size="10" text-anchor="middle">v = (p3.x + p3.y)</text>
  <text x="600" y="148" fill="#8b98ad" font-size="10" text-anchor="middle">    * p3.z</text>
  <text x="600" y="170" fill="#8b98ad" font-size="10" text-anchor="middle">v = fract(v)</text>
  <text x="600" y="200" fill="#5a6577" font-size="9" text-anchor="middle">scalar fold -> [0, 1)</text>

  <!-- output -->
  <rect x="525" y="250" width="150" height="36" rx="10" fill="#10151f" stroke="#00a1e4" stroke-width="2"/>
  <text x="600" y="273" fill="#00a1e4" font-size="12" text-anchor="middle">v : f64 in [0, 1)</text>

  <!-- arrows -->
  <path d="M120 150 L148 150" stroke="#00a1e4" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M305 150 L333 150" stroke="#00a1e4" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M490 150 L518 150" stroke="#00a1e4" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M600 220 L600 244" stroke="#00a1e4" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8" fill="none" stroke="#00a1e4" stroke-width="1.5"/>
    </marker>
  </defs>
</svg>
