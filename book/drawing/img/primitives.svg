<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 408" font-family="'Source Code Pro',ui-monospace,monospace">
  <rect width="660" height="408" rx="14" fill="#0a0e16" stroke="#1c2433"/>

  <text x="330" y="36" fill="#8b98ad" font-size="11" letter-spacing="2" text-anchor="middle">PRIMITIVE DRAW SPECS — what each one paints</text>

  <!-- fill_background -->
  <g>
    <rect x="40" y="56" width="96" height="72" rx="8" fill="#10151f" stroke="#1c2433"/>
    <rect x="50" y="66" width="76" height="52" rx="4" fill="#00a1e4" fill-opacity="0.25" stroke="#00a1e4" stroke-dasharray="3 3"/>
    <text x="88" y="146" fill="#e8ecf4" font-size="10" text-anchor="middle">fill_background</text>
  </g>
  <!-- fill_rect -->
  <g>
    <rect x="146" y="56" width="96" height="72" rx="8" fill="#10151f" stroke="#1c2433"/>
    <rect x="162" y="72" width="64" height="40" rx="2" fill="#f5b700" fill-opacity="0.5" stroke="#f5b700"/>
    <text x="194" y="146" fill="#e8ecf4" font-size="10" text-anchor="middle">fill_rect</text>
  </g>
  <!-- stroke_rect -->
  <g>
    <rect x="252" y="56" width="96" height="72" rx="8" fill="#10151f" stroke="#1c2433"/>
    <rect x="268" y="72" width="64" height="40" rx="2" fill="none" stroke="#04e762" stroke-width="3"/>
    <text x="300" y="146" fill="#e8ecf4" font-size="10" text-anchor="middle">stroke_rect</text>
  </g>
  <!-- fill_circle -->
  <g>
    <rect x="358" y="56" width="96" height="72" rx="8" fill="#10151f" stroke="#1c2433"/>
    <circle cx="406" cy="92" r="22" fill="#dc0073" fill-opacity="0.55" stroke="#dc0073"/>
    <text x="406" y="146" fill="#e8ecf4" font-size="10" text-anchor="middle">fill_circle</text>
  </g>
  <!-- fill_polygon -->
  <g>
    <rect x="464" y="56" width="96" height="72" rx="8" fill="#10151f" stroke="#1c2433"/>
    <polygon points="512,68 540,104 528,118 496,118 484,104" fill="#89fc00" fill-opacity="0.35" stroke="#89fc00"/>
    <text x="512" y="146" fill="#e8ecf4" font-size="10" text-anchor="middle">fill_polygon</text>
  </g>
  <!-- stroke_polyline -->
  <g>
    <rect x="40" y="164" width="96" height="72" rx="8" fill="#10151f" stroke="#1c2433"/>
    <polyline points="56,216 72,186 88,206 104,178 120,196" fill="none" stroke="#00a1e4" stroke-width="2.5"/>
    <text x="88" y="254" fill="#e8ecf4" font-size="10" text-anchor="middle">stroke_polyline</text>
  </g>
  <!-- fill_sector -->
  <g>
    <rect x="146" y="164" width="96" height="72" rx="8" fill="#10151f" stroke="#1c2433"/>
    <path d="M 194 200 m -24 0 a 24 24 0 0 1 20 -22 l 4 -6 a 30 30 0 0 0 -24 28 z" fill="none"/>
    <path d="M 194 200 L 176 180 A 24 24 0 0 1 218 188 L 208 192 A 12 12 0 0 0 185 192 Z" fill="#f5b700" fill-opacity="0.6" stroke="#f5b700"/>
    <circle cx="194" cy="200" r="24" fill="none" stroke="#3a4560" stroke-dasharray="3 3"/>
    <text x="194" y="254" fill="#e8ecf4" font-size="10" text-anchor="middle">fill_sector</text>
  </g>

  <!-- spec anatomy panel -->
  <rect x="252" y="164" width="368" height="72" rx="10" fill="#10151f" stroke="#1c2433"/>
  <text x="436" y="184" fill="#8b98ad" font-size="10" letter-spacing="1.5" text-anchor="middle">EVERY SPEC = geometry + Color&lt;f64&gt; + Alpha</text>
  <g font-size="10" fill="#8b98ad">
    <text x="436" y="206" text-anchor="middle">Fill* → geometry · Stroke* → + line_width · cap</text>
    <text x="436" y="222" text-anchor="middle">FillSectors → + count · gap · colors cycled</text>
  </g>

  <!-- stroke_circle -->
  <g>
    <rect x="40" y="272" width="96" height="72" rx="8" fill="#10151f" stroke="#1c2433"/>
    <circle cx="88" cy="308" r="22" fill="none" stroke="#dc0073" stroke-width="4"/>
    <text x="88" y="362" fill="#e8ecf4" font-size="10" text-anchor="middle">stroke_circle</text>
  </g>
  <!-- stroke_arc -->
  <g>
    <rect x="146" y="272" width="96" height="72" rx="8" fill="#10151f" stroke="#1c2433"/>
    <circle cx="194" cy="308" r="22" fill="none" stroke="#3a4560" stroke-dasharray="3 3"/>
    <path d="M194,286 A22,22 0 0 1 214,318" fill="none" stroke="#04e762" stroke-width="4" stroke-linecap="round"/>
    <text x="194" y="362" fill="#e8ecf4" font-size="10" text-anchor="middle">stroke_arc</text>
  </g>
  <!-- stroke_polygon -->
  <g>
    <rect x="252" y="272" width="96" height="72" rx="8" fill="#10151f" stroke="#1c2433"/>
    <polygon points="300,288 322,304 314,328 286,328 278,304" fill="none" stroke="#89fc00" stroke-width="3" stroke-linejoin="round"/>
    <text x="300" y="362" fill="#e8ecf4" font-size="10" text-anchor="middle">stroke_polygon</text>
  </g>
  <!-- stroke_sector -->
  <g>
    <rect x="358" y="272" width="96" height="72" rx="8" fill="#10151f" stroke="#1c2433"/>
    <path d="M406,308 L388,288 A24 24 0 0 1 430 296 L420 300 A12 12 0 0 0 397 300 Z" fill="none" stroke="#f5b700" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="406" cy="308" r="24" fill="none" stroke="#3a4560" stroke-dasharray="3 3"/>
    <text x="406" y="362" fill="#e8ecf4" font-size="10" text-anchor="middle">stroke_sector</text>
  </g>
  <!-- fill_sectors -->
  <g>
    <rect x="464" y="272" width="96" height="72" rx="8" fill="#10151f" stroke="#1c2433"/>
    <path d="M529.9,309.6 A18,18 0 0 1 513.6,325.9" fill="none" stroke="#00a1e4" stroke-width="12"/>
    <path d="M510.4,325.9 A18,18 0 0 1 494.1,309.6" fill="none" stroke="#dc0073" stroke-width="12"/>
    <path d="M494.1,306.4 A18,18 0 0 1 510.4,290.1" fill="none" stroke="#f5b700" stroke-width="12"/>
    <path d="M513.6,290.1 A18,18 0 0 1 529.9,306.4" fill="none" stroke="#04e762" stroke-width="12"/>
    <text x="512" y="362" fill="#e8ecf4" font-size="10" text-anchor="middle">fill_sectors</text>
  </g>

  <text x="330" y="392" fill="#8b98ad" font-size="10.5" text-anchor="middle">all ops source-over blend — `alpha` multiplies the color's own alpha channel</text>
</svg>
