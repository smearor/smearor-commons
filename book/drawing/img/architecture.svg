<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 360" font-family="'Source Code Pro',ui-monospace,monospace">
  <rect width="660" height="360" rx="14" fill="#0a0e16" stroke="#1c2433"/>

  <text x="330" y="38" fill="#8b98ad" font-size="11" letter-spacing="2" text-anchor="middle">INTERNAL LAYERING — ops · tech · buffer · cairo · facade</text>

  <!-- facade on top -->
  <rect x="190" y="56" width="280" height="46" rx="10" fill="#10151f" stroke="#f5b700" stroke-width="2"/>
  <text x="330" y="77" fill="#f5b700" font-size="13" text-anchor="middle">RenderContext&lt;T: DrawTarget&gt;</text>
  <text x="330" y="93" fill="#8b98ad" font-size="9.5" text-anchor="middle">builder facade — fonts · colors · active</text>

  <!-- ops vocabulary -->
  <rect x="40" y="136" width="300" height="86" rx="10" fill="#10151f" stroke="#00a1e4" stroke-width="2"/>
  <text x="190" y="158" fill="#00a1e4" font-size="12.5" text-anchor="middle">ops — the vocabulary</text>
  <g font-size="9.5" fill="#e8ecf4" text-anchor="middle">
    <text x="190" y="178">DrawPrimitiveOps · DrawIconOps</text>
    <text x="190" y="194">DrawTextOps · DrawProgressOps</text>
    <text x="190" y="210" fill="#8b98ad">DrawOps supertrait · DrawTarget</text>
  </g>

  <!-- tech -->
  <rect x="360" y="136" width="260" height="86" rx="10" fill="#10151f" stroke="#04e762" stroke-width="1.5"/>
  <text x="490" y="158" fill="#04e762" font-size="12.5" text-anchor="middle">tech — adapters</text>
  <g font-size="9.5" fill="#e8ecf4" text-anchor="middle">
    <text x="490" y="178">ab_glyph metrics wrapper</text>
    <text x="490" y="194">glyph_fit_scale cache</text>
    <text x="490" y="210" fill="#8b98ad">any backend may use</text>
  </g>

  <!-- backends -->
  <rect x="40" y="256" width="300" height="72" rx="10" fill="#10151f" stroke="#dc0073" stroke-width="1.5"/>
  <text x="190" y="278" fill="#dc0073" font-size="12.5" text-anchor="middle">buffer — software raster</text>
  <g font-size="9.5" fill="#e8ecf4" text-anchor="middle">
    <text x="190" y="296">BufferViewMut&lt;Rgba&gt; · PixelBuffer</text>
    <text x="190" y="312" fill="#8b98ad">Error = Infallible</text>
  </g>

  <rect x="360" y="256" width="260" height="72" rx="10" fill="#10151f" stroke="#8b98ad" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="490" y="278" fill="#e8ecf4" font-size="12.5" text-anchor="middle">cairo — feature "cairo"</text>
  <g font-size="9.5" fill="#e8ecf4" text-anchor="middle">
    <text x="490" y="296">CairoTarget · ViewSurface</text>
    <text x="490" y="312" fill="#8b98ad">Error = cairo::Error (sticky)</text>
  </g>

  <!-- arrows -->
  <line x1="260" y1="102" x2="200" y2="130" stroke="#f5b700" stroke-width="1.5"/>
  <polygon points="200,130 210,127 205,136" fill="#f5b700" transform="rotate(-28 200 130)"/>
  <line x1="400" y1="102" x2="490" y2="130" stroke="#8b98ad" stroke-width="1.5" stroke-dasharray="4 3"/>

  <line x1="130" y1="222" x2="130" y2="250" stroke="#dc0073" stroke-width="1.5"/>
  <polygon points="130,250 126,243 134,243" fill="#dc0073"/>
  <line x1="250" y1="222" x2="250" y2="250" stroke="#dc0073" stroke-width="1.5"/>
  <polygon points="250,250 246,243 254,243" fill="#dc0073"/>

  <line x1="430" y1="222" x2="430" y2="250" stroke="#8b98ad" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="550" y1="222" x2="550" y2="250" stroke="#8b98ad" stroke-width="1.5" stroke-dasharray="4 3"/>

  <text x="330" y="348" fill="#8b98ad" font-size="10.5" text-anchor="middle">one vocabulary, two backends — specs in, Result&lt;(), T::Error&gt; out</text>
</svg>
