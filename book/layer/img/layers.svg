<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" font-family="'Source Code Pro',ui-monospace,monospace">
  <rect width="660" height="300" rx="14" fill="#0a0e16" stroke="#1c2433"/>

  <text x="330" y="36" fill="#8b98ad" font-size="11" letter-spacing="2" text-anchor="middle">SMEARORLAYER — the surface stack, bottom to top</text>

  <!-- clean stacked bands -->
  <g transform="translate(0,14)">
    <rect x="50" y="238" width="360" height="34" rx="8" fill="#3a4560" fill-opacity="0.3" stroke="#3a4560"/>
    <text x="230" y="259" fill="#8b98ad" font-size="10.5" text-anchor="middle">desktop / wallpaper</text>

    <rect x="50" y="196" width="360" height="36" rx="8" fill="#8b98ad" fill-opacity="0.12" stroke="#8b98ad" stroke-width="1.5"/>
    <text x="230" y="219" fill="#e8ecf4" font-size="11" text-anchor="middle">Background</text>

    <rect x="50" y="154" width="360" height="36" rx="8" fill="#00a1e4" fill-opacity="0.12" stroke="#00a1e4" stroke-width="1.5"/>
    <text x="230" y="177" fill="#00a1e4" font-size="11" text-anchor="middle">Bottom</text>

    <rect x="50" y="112" width="360" height="36" rx="8" fill="#f5b700" fill-opacity="0.08" stroke="#f5b700" stroke-width="1.2" stroke-dasharray="5 4"/>
    <text x="230" y="135" fill="#f5b700" font-size="10.5" text-anchor="middle">regular windows</text>

    <rect x="50" y="70" width="360" height="36" rx="8" fill="#04e762" fill-opacity="0.12" stroke="#04e762" stroke-width="1.5"/>
    <text x="230" y="93" fill="#04e762" font-size="11" text-anchor="middle">Top — default</text>

    <rect x="50" y="28" width="360" height="36" rx="8" fill="#dc0073" fill-opacity="0.12" stroke="#dc0073" stroke-width="1.5"/>
    <text x="230" y="51" fill="#dc0073" font-size="11" text-anchor="middle">Overlay — above everything</text>
  </g>

  <!-- parsing panel -->
  <rect x="450" y="80" width="180" height="190" rx="10" fill="#10151f" stroke="#1c2433"/>
  <text x="540" y="106" fill="#8b98ad" font-size="10" letter-spacing="1.5" text-anchor="middle">TWO PARSERS</text>
  <g font-size="9.5" fill="#8b98ad">
    <text x="466" y="132" fill="#e8ecf4">FromStr — strict</text>
    <text x="466" y="150">CLI: unknown →</text>
    <text x="466" y="164">ParseLayerError</text>
    <text x="466" y="192" fill="#e8ecf4">From&lt;&amp;str&gt; — lenient</text>
    <text x="466" y="210">config→CLI bridge:</text>
    <text x="466" y="224">unknown → Top</text>
    <text x="466" y="250" fill="#3a4560">both case-insensitive,</text>
    <text x="466" y="262" fill="#3a4560">serde aliases too</text>
  </g>
</svg>
