[package]
name = "smearor-commons-fx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Headless, serializable per-pixel effects for the Smearor ecosystem: typed window/content effects over `PixelBuffer` textures, parameter metadata for generated UIs, CPU-first rendering."

[features]
default = []
cairo = ["dep:cairo-rs", "dep:smearor-commons-drawing", "smearor-commons-drawing/cairo"]
gtk4 = ["cairo", "smearor-commons-buffer/gtk4", "dep:gtk4"]
schemars = ["dep:schemars", "smearor-commons-geometry/schemars", "smearor-commons-color/schemars"]

[dependencies]
cairo-rs = { workspace = true, optional = true }
gtk4 = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
serde.workspace = true
smearor-commons-animation.workspace = true
smearor-commons-buffer.workspace = true
smearor-commons-color.workspace = true
smearor-commons-drawing = { workspace = true, optional = true }
smearor-commons-geometry.workspace = true
smearor-commons-noise.workspace = true
thiserror.workspace = true

[dev-dependencies]
serde_json = "1.0"

[[example]]
name = "fx"
required-features = ["gtk4"]

[[example]]
name = "dump_card"
required-features = ["gtk4"]

[[example]]
name = "dump_frame"
required-features = ["gtk4"]
