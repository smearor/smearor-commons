[package]
name = "smearor-commons-color"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Generic color types for the Smearor ecosystem: channel-generic `Color<T>`, hex and CSS named-color parsing and color operations."

[features]
# transport / schema
async-graphql = ["dep:async-graphql"]
schemars = ["dep:schemars"]
zbus = ["dep:zvariant"]
# ui / backend
cairo = ["dep:cairo-rs"]
gtk4 = ["dep:gtk4"]

[dependencies]
async-graphql = { workspace = true, optional = true }
cairo-rs = { workspace = true, optional = true }
gtk4 = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
serde.workspace = true
thiserror.workspace = true
zvariant = { workspace = true, optional = true }

[dev-dependencies]
serde_json = "1.0"
smearor-commons-buffer = { workspace = true }
smearor-commons-drawing = { workspace = true, features = ["cairo"] }
smearor-commons-geometry = { workspace = true }

[[example]]
name = "cie_xy"
required-features = ["gtk4"]

[[example]]
name = "fan"
required-features = ["gtk4"]

[[example]]
name = "ncs"
required-features = ["gtk4"]

[[example]]
name = "gamut"
required-features = ["gtk4"]

[[example]]
name = "munsell"
required-features = ["gtk4"]

[[example]]
name = "osa"
required-features = ["gtk4"]

[[example]]
name = "ostwald"
required-features = ["gtk4"]

[[example]]
name = "palette"
required-features = ["gtk4"]

[[example]]
name = "runge"
required-features = ["gtk4"]
